    #app::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(229,239,247,0.08), rgba(255,255,255,0.03));
      pointer-events: none;
      z-index: 0;
    }

    .topbar {
      position: absolute;
      top: 18px;
      left: 18px;
      right: 18px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      z-index: 30;
    }

    .info-card {
      max-width: min(500px, 72vw);
      padding: 16px 18px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.40);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.55);
      box-shadow: 0 12px 26px rgba(65, 93, 120, 0.14);
      color: #2f5686;
    }

    .info-card h1 {
      margin: 0 0 6px;
      font-size: clamp(24px, 3vw, 34px);
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .info-card p {
      margin: 0;
      font-size: clamp(14px, 1.45vw, 18px);
      line-height: 1.45;
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
    }

    .chip {
      padding: 12px 20px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.68);
      background: rgba(255,255,255,0.45);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #31588a;
      font-weight: 700;
      font-size: 16px;
      box-shadow: 0 8px 18px rgba(56, 95, 140, 0.12);
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    .chip:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(56, 95, 140, 0.16);
      background: rgba(255,255,255,0.6);
    }

    .chip.small-label {
      cursor: default;
      font-size: 15px;
      padding: 10px 16px;
    }

    #snowLayer {
      position: absolute;
      inset: 0;
      z-index: 20;
      overflow: hidden;
    }

    .word-flake {
      position: absolute;
      width: 138px;
      height: 138px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 22px;
      color: #436791;
      font-size: 24px;
      font-weight: 700;
      line-height: 1.06;
      user-select: none;
      cursor: pointer;
      filter: drop-shadow(0 10px 14px rgba(86, 112, 138, 0.18));
      transition: opacity 0.45s ease, transform 0.3s ease;
      will-change: transform;
    }

    .word-flake::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,0.97) 0%, rgba(255,255,255,0.95) 52%, rgba(240,248,255,0.85) 100%);
      clip-path: polygon(50% 0%, 61% 17%, 82% 8%, 76% 28%, 100% 34%, 82% 50%, 100% 66%, 76% 72%, 82% 92%, 61% 83%, 50% 100%, 39% 83%, 18% 92%, 24% 72%, 0% 66%, 18% 50%, 0% 34%, 24% 28%, 18% 8%, 39% 17%);
      border: 2.5px solid rgba(255,255,255,0.95);
      box-shadow: inset 0 0 0 1px rgba(200, 220, 239, 0.85);
      z-index: -2;
    }

    .word-flake::after {
      content: "❄";
      position: absolute;
      font-size: 88px;
      color: rgba(160, 186, 214, 0.18);
      z-index: -1;
      pointer-events: none;
    }

    .word-flake:hover {
      transform: scale(1.03);
    }

    .word-flake.correct-hit {
      pointer-events: none;
      animation: vanish 0.55s forwards;
    }

    .word-flake.wrong-hit {
      animation: wobble 0.46s ease;
    }

    @keyframes vanish {
      0% { opacity: 1; transform: scale(1); }
      55% { opacity: 0.9; transform: scale(1.12); }
      100% { opacity: 0; transform: scale(0.18); }
    }

    @keyframes wobble {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      25% { transform: translateX(-8px) rotate(-3deg); }
      50% { transform: translateX(8px) rotate(3deg); }
      75% { transform: translateX(-5px) rotate(-2deg); }
    }

    .mini-snow {
      position: absolute;
      top: -30px;
      color: rgba(255,255,255,0.85);
      user-select: none;
      pointer-events: none;
      z-index: 8;
      animation: miniFall linear infinite;
    }

    @keyframes miniFall {
      0% { transform: translateY(-20px) translateX(0); opacity: 0.15; }
      15% { opacity: 0.9; }
      100% { transform: translateY(110vh) translateX(32px); opacity: 0.08; }
    }

    #donePanel {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(210, 226, 240, 0.22);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 40;
      padding: 20px;
    }

    .done-box {
      width: min(460px, 88vw);
      text-align: center;
      padding: 28px 24px;
      border-radius: 24px;
      background: rgba(255,255,255,0.62);
      border: 1px solid rgba(255,255,255,0.8);
      box-shadow: 0 20px 34px rgba(76, 105, 132, 0.14);
      color: #315887;
    }

    .done-box h2 {
      margin: 0 0 10px;
      font-size: clamp(28px, 3.4vw, 40px);
    }

    .done-box p {
      margin: 0 0 16px;
      font-size: clamp(16px, 1.7vw, 20px);
      line-height: 1.5;
    }

    @media (max-width: 850px) {
      .topbar {
        flex-direction: column;
        align-items: stretch;
      }
      .controls {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: flex-start;
        align-items: center;
      }
      .info-card { max-width: 100%; }
      .word-flake { width: 118px; height: 118px; font-size: 20px; padding: 18px; }
      .word-flake::after { font-size: 74px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="topbar">
      <div class="info-card">
        <h1>Catch the Snowflakes</h1>
        <p>Қысқа қатысты <b>дұрыс сөздері бар</b> ақ қар ұлпаларын басыңыз. Дұрыс сөз жоғалады, қате сөз орнында қалады.</p>
      </div>
      <div class="controls">
        <div class="chip small-label">Correct words only ✨</div>
        <button class="chip" id="restartBtn">↻ Play Again</button>
      </div>
    </div>

    <div id="snowLayer"></div>

    <div id="donePanel">
      <div class="done-box">
        <h2>Wonderful! ❄</h2>
        <p>Сіз барлық дұрыс қар ұлпаларын таптыңыз.</p>
        <button class="chip" id="playAgainInside">Play Again</button>
      </div>
    </div>
  </div>

  <script>
    const correctWords = ["snow", "cold", "snowflake", "winter", "Ice", "frost", "gloves"];
    const wrongWords = ["summer", "beach", "hot", "sunglasses", "flowers", "sand"];
    const app = document.getElementById('app');
    const layer = document.getElementById('snowLayer');
    const restartBtn = document.getElementById('restartBtn');
    const donePanel = document.getElementById('donePanel');
    const playAgainInside = document.getElementById('playAgainInside');

    let flakes = [];
    let fallingSnow = [];
    let completedCorrect = 0;
    let rafId = null;

    function createBackgroundSnow() {
      for (let i = 0; i < 32; i++) {
        const dot = document.createElement('div');
        dot.className = 'mini-snow';
        dot.textContent = Math.random() > 0.7 ? '❄' : '•';
        dot.style.left = Math.random() * window.innerWidth + 'px';
        dot.style.fontSize = (8 + Math.random() * 16) + 'px';
        dot.style.animationDuration = (9 + Math.random() * 9) + 's';
        dot.style.animationDelay = (-Math.random() * 20) + 's';
        app.appendChild(dot);
        fallingSnow.push(dot);
      }
    }

    function clearWordFlakes() {
      flakes.forEach(item => item.el.remove());
      flakes = [];
      completedCorrect = 0;
    }

    function getSize() {
      return window.innerWidth <= 850 ? 118 : 138;
    }

    function randomBetween(min, max) {
      return Math.random() * (max - min) + min;
    }

    function randomX(size) {
      return randomBetween(8, Math.max(20, window.innerWidth - size - 8));
    }

    function setupWordFlakes() {
      clearWordFlakes();
      donePanel.style.display = 'none';

      const allWords = [
        ...correctWords.map(word => ({ word, correct: true })),
        ...wrongWords.map(word => ({ word, correct: false }))
      ].sort(() => Math.random() - 0.5);

      const size = getSize();
      const columns = Math.min(5, Math.max(3, Math.floor(window.innerWidth / 190)));
      const xSlots = [];
      const gap = Math.max(10, (window.innerWidth - columns * size) / (columns + 1));
      for (let i = 0; i < columns; i++) {
        xSlots.push(gap + i * (size + gap));
      }

      allWords.forEach((item, index) => {
        const el = document.createElement('div');
        el.className = 'word-flake';
        el.innerHTML = `<span>${item.word}</span>`;
        layer.appendChild(el);

        const columnIndex = index % columns;
        const x = xSlots[columnIndex] + randomBetween(-12, 12);
        const y = -randomBetween(70, 900) - index * 55;
        const speed = randomBetween(0.28, 0.52);
        const driftAmp = randomBetween(8, 20);
        const driftSpeed = randomBetween(0.006, 0.016);
        const stopY = Math.min(window.innerHeight - size - 30, randomBetween(window.innerHeight * 0.46, window.innerHeight * 0.78));

        const obj = {
          el,
          word: item.word,
          correct: item.correct,
          x,
          baseX: x,
          y,
          speed,
          size,
          drift: Math.random() * Math.PI * 2,
          driftAmp,
          driftSpeed,
          stopY,
          removed: false,
          settled: false,
        };

        el.addEventListener('click', () => handleClick(obj));
        flakes.push(obj);
      });
    }

    function renderFlake(f) {
      const dx = Math.sin(f.drift) * f.driftAmp;
      f.el.style.transform = `translate(${f.baseX + dx}px, ${f.y}px)`;
    }

    function animate() {
      flakes.forEach(f => {
        if (f.removed) return;
        if (!f.settled) {
          f.y += f.speed;
          f.drift += f.driftSpeed;
          if (f.y >= f.stopY) {
            f.y = f.stopY;
            f.settled = true;
          }
        } else {
          f.drift += 0.003;
          f.driftAmp = Math.min(f.driftAmp, 5);
        }
        renderFlake(f);
      });
      rafId = requestAnimationFrame(animate);
    }

    function handleClick(f) {
      if (f.removed) return;

      if (f.correct) {
        f.removed = true;
        f.el.classList.remove('wrong-hit');
        f.el.classList.add('correct-hit');
        completedCorrect += 1;
        setTimeout(() => {
          f.el.style.display = 'none';
        }, 520);

        if (completedCorrect === correctWords.length) {
          setTimeout(() => {
            donePanel.style.display = 'flex';
          }, 700);
        }
      } else {
        f.el.classList.remove('wrong-hit');
        void f.el.offsetWidth;
        f.el.classList.add('wrong-hit');
      }
    }

    function resetGame() {
      cancelAnimationFrame(rafId);
      setupWordFlakes();
      flakes.forEach(renderFlake);
      animate();
    }

    restartBtn.addEventListener('click', resetGame);
    playAgainInside.addEventListener('click', resetGame);

    window.addEventListener('resize', () => {
      resetGame();
    });

    createBackgroundSnow();
    resetGame();
  </script>
</body>
</html>
